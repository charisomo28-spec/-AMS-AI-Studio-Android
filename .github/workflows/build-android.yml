name: Build AMS Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Extract AMS Android web application
        run: |
          mkdir -p extracted
          unzip -oq AMS_AI_Studio_Android_v0.1.0.zip -d extracted
          test -f extracted/www/index.html
          cp -R extracted/www .
          test -f www/index.html
      - name: Position AMS chat composer above Android navigation
        run: |
          test -f patches/ams-mobile-chat.js
          cp patches/ams-mobile-chat.js www/ams-mobile-chat.js
          python3 - <<'PY'
          from pathlib import Path
          html = Path('www/index.html')
          content = html.read_text(encoding='utf-8')
          marker = '<script defer src="ams-mobile-chat.js"></script>'
          import re
          content = re.sub(r'<meta[^>]+name=[^>]*viewport[^>]*>', '', content, flags=re.I)
          content = content.replace('</head>', '<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head>')
          if marker not in content:
              if '</body>' not in content:
                  raise SystemExit('Cannot inject AMS chat patch: closing body tag missing')
              content = content.replace('</body>', marker + '</body>')
          html.write_text(content, encoding='utf-8')
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Configure Android SDK
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          test -d "$SDK_ROOT"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          test -f "$SDK_ROOT/platform-tools/adb" || echo "ADB will be installed by Gradle if needed"
          echo "Android SDK directory: $SDK_ROOT"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Prepare Android project
        run: |
          npx cap add android
          npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Verify APK and bundled web application
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep -q 'assets/public/index.html'
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep -q 'assets/public/ams-mobile-chat.js'
          unzip -p android/app/build/outputs/apk/debug/app-debug.apk assets/public/index.html | grep -q 'ams-mobile-chat.js'
          echo "APK built and AMS web assets included"
      - uses: actions/upload-artifact@v4
        with:
          name: AMS-AI-Studio-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
